# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# lychee is not in the trunk plugin registry, so the binary, the tool shim, and the
# linter are all defined here. Every published archive nests its payload under one
# top-level directory, hence the uniform strip_components.
downloads:
  - name: lychee
    downloads:
      - os:
          linux: unknown-linux-gnu
          macos: apple-darwin
        cpu:
          x86_64: x86_64
          arm_64: aarch64
        url: https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/lychee-${cpu}-${os}.tar.gz
        strip_components: 1
      - os: windows
        cpu: x86_64
        url: https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/lychee-x86_64-pc-windows-msvc.zip
        strip_components: 1
tools:
  definitions:
    - name: lychee
      download: lychee
      known_good_version: 0.24.2
      shims: [lychee]
      health_checks:
        - command: lychee --version
          parse_regex: ${semver}
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    # markdownlint's MD051 only validates same-file fragments, and the registry's
    # markdown-link-check drops the fragment for `file:` links entirely (it resolves
    # `#foo` only for same-page links) — so neither catches a cross-file anchor like
    # `../README.md#tui`. lychee does, and `--offline` keeps CI network-free by
    # excluding every http(s) URL rather than fetching it.
    - name: lychee
      files: [markdown]
      tools: [lychee]
      description: Offline relative-link and anchor-fragment checker
      commands:
        - name: lint
          output: sarif
          # A relative link can only be resolved against the whole tree, and trunk's
          # sandbox holds just the batch's own files — so every cross-file link came
          # back "File not found". Scanning ${workspace} (the real checkout) is the
          # ls-lint pattern for whole-repo tools; `target: .` keeps that one scan from
          # being repeated once per batch. lychee honours .gitignore, so .venv and
          # friends stay out. The parser makes the absolute paths repo-relative.
          run: lychee --offline --include-fragments --no-progress --format json ${workspace}
          target: .
          # 0 = clean, 2 = link failures; anything else is a real lychee fault.
          success_codes: [0, 2]
          parser:
            runtime: python
            run: python3 ${workspace}/.trunk/lychee_to_sarif.py --root ${workspace}
          batch: true
          # The scan is whole-tree, so a per-target cache entry would be a lie.
          cache_results: false
          read_output_from: stdout
      suggest_if: never
      known_good_version: 0.24.2
  enabled:
    - lychee@0.24.2
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.1
    - git-diff-check
    - hadolint@2.14.0
    - isort@8.0.1
    - markdownlint@0.48.0
    - prettier@3.8.4
    - ruff@0.15.17
    - taplo@0.10.0
    - trufflehog@3.95.5
    - yamllint@1.38.0
    - zizmor@1.29.0
  ignore:
    # Test code legitimately uses asserts, temp paths, and subprocess helpers; security
    # scanning them only produces noise.
    - linters: [bandit]
      paths:
        - tests/**
    # CODE_OF_CONDUCT.md is the verbatim Contributor Covenant; keep it byte-identical to
    # upstream (prettier would rewrite its * bullets). Mirrors BMAD-METHOD's ignore.
    - linters: [markdownlint, prettier]
      paths:
        - .github/CODE_OF_CONDUCT.md
actions:
  disabled:
    - trunk-announce
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
    # Block a push when `trunk check` finds issues, so formatting/lint failures
    # (e.g. prettier on CHANGELOG.md) surface locally instead of in CI.
    - trunk-check-pre-push
